  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #e6dfcc;
    font-family: 'Gochi Hand', 'Comic Sans MS', cursive;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: absolute; left: 50%; top: 50%;
    width: 400px; height: 640px;
    transform-origin: center center;
    box-shadow: 0 0 30px rgba(0,0,0,.25);
  }
  canvas { display: block; width: 400px; height: 640px; }
  .overlay {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center;
    text-align: center; color: #2a2a1f;
  }
  .overlay.show { display: flex; }
  .overlay.dim { background: rgba(247,242,226,.8); justify-content: center; }
  #menu { justify-content: flex-start; padding-top: 40px; box-sizing: border-box; }
  h1 {
    font-size: 72px; line-height: .85; margin: 0 0 18px; font-weight: normal;
    color: #d8392b; transform: rotate(-7deg);
    text-shadow: 3px 3px 0 rgba(42,42,31,.25);
  }
  h2 { font-size: 56px; margin: 0 0 10px; font-weight: normal; color: #d8392b; transform: rotate(-4deg); }
  p { font-size: 26px; margin: 4px 0; }
  .hint { font-size: 20px; margin-top: 14px; color: #4a4a3a; line-height: 1.25; }
  .btn {
    font-family: inherit; font-size: 32px; color: #2a2a1f;
    padding: 4px 30px; margin: 8px;
    background: #fdfaf0; border: 3px solid #2a2a1f;
    border-radius: 16px 10px 18px 8px;
    box-shadow: 3px 3px 0 #2a2a1f; cursor: pointer;
  }
  .btn:hover { background: #fff6c8; }
  .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2a1f; }
  #newBest { color: #d8392b; font-size: 30px; display: none; }
  #pauseBtn {
    position: absolute; top: 5px; right: 8px; display: none;
    font-family: inherit; font-size: 22px; width: 36px; height: 34px; padding: 0;
    background: #fdfaf0; border: 2px solid #2a2a1f; border-radius: 8px; cursor: pointer;
  }
  #soundBtn {
    position: absolute; top: 5px; right: 50px; z-index: 2;
    font-size: 18px; width: 36px; height: 34px; padding: 0;
    background: #fdfaf0; border: 2px solid #2a2a1f; border-radius: 8px; cursor: pointer;
  }
  .picker { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .picker .arrow {
    font-family: inherit; font-size: 26px; width: 40px; height: 40px; padding: 0;
    background: #fdfaf0; border: 2px solid #2a2a1f; border-radius: 10px; cursor: pointer;
  }
  #charName { font-size: 30px; min-width: 160px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="pauseBtn" title="Pause (P)">II</button>
  <button id="soundBtn" title="Sound on/off"></button>

  <div id="menu" class="overlay show">
    <h1>stoners<br>jump</h1>
    <button class="btn" id="playBtn">play</button>
    <div class="picker">
      <button class="arrow" id="prevChar">&lt;</button>
      <span id="charName"></span>
      <button class="arrow" id="nextChar">&gt;</button>
    </div>
    <p class="hint">&larr; &rarr; / A D : move<br>Space / &uarr; / Click : shoot<br>P / Esc : pause<br>Mobile: tilt or hold left/right,<br>tap to shoot</p>
    <p class="hint" id="tiltHint"></p>
    <p>high score: <span id="menuBest">0</span></p>
  </div>

  <div id="pause" class="overlay dim">
    <h2>paused</h2>
    <button class="btn" id="resumeBtn">resume</button>
    <button class="btn" id="pauseMenuBtn">menu</button>
  </div>

  <div id="over" class="overlay dim">
    <h2>game over!</h2>
    <p>your score: <b id="ovScore">0</b></p>
    <p>your high score: <b id="ovBest">0</b></p>
    <p id="newBest">new high score!</p>
    <button class="btn" id="againBtn">play again</button>
    <button class="btn" id="overMenuBtn">menu</button>
  </div>
</div>

<script>
'use strict';

const W = 400, H = 640, STEP = 1000 / 60;
const G = 0.35, JUMP = 11.2, SPRING = 18, TRAMP = 24, MAXVX = 6.5;
const INK = '#2a2a1f';
const HS_KEY = 'stonersJumpHighscore';
const FONT = '"Gochi Hand", "Comic Sans MS", cursive';
const CHAR_KEY = 'stonersJumpCharacter', SOUND_KEY = 'stonersJumpSound';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const $ = id => document.getElementById(id);

let state = 'menu';
let player, platforms, monsters, bullets, particles;
let camY, startY, genY, maxHeight, score, lastMonsterH, fallT, frame = 0;
let highscore = 0;
try { highscore = parseInt(localStorage.getItem(HS_KEY), 10) || 0; } catch (e) { highscore = 0; }

const keys = { left: false, right: false };

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) =>
  ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

/* ---------- setup ---------- */

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  wrap.style.transform = `translate(-50%,-50%) scale(${s})`;
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}

function newPlayer(x, y) {
  return { x, y, w: 40, h: 44, vx: 0, vy: -JUMP, dir: 1,
           shootT: 0, cool: 0, flip: 0, power: null, powerT: 0, dead: false };
}

function addPlatform(type, y) {
  const h = startY - y;
  const d = Math.min(1, h / 25000);
  const pl = { x: rand(0, W - 58), y, w: 58, h: 14, type, vx: 0,
               item: null, broken: false, bt: 0, vy: 0, gone: false, alpha: 1 };
  if (type === 'moving') pl.vx = rand(1, 1.5 + 1.5 * d) * (Math.random() < .5 ? -1 : 1);
  platforms.push(pl);
  return pl;
}

function makeItem(pl, h) {
  const r = Math.random();
  let it = null;
  if (h > 300 && r < 0.006) it = { type: 'jetpack', w: 24, h: 34 };
  else if (h > 300 && r < 0.018) it = { type: 'propeller', w: 28, h: 20 };
  else if (r < 0.03) it = { type: 'trampoline', w: 36, h: 10 };
  else if (r < 0.09) it = { type: 'spring', w: 16, h: 14 };
  if (it) { it.ox = rand(4, pl.w - it.w - 4); it.used = false; }
  return it;
}

function addMonster(cy) {
  monsters.push({ x: rand(0, W - 56), y: cy - 20, w: 56, h: 40,
                  vx: Math.random() < .5 ? rand(0.8, 1.6) * (Math.random() < .5 ? -1 : 1) : 0,
                  t: rand(0, 100), dead: false, vy: 0, rot: 0, vr: 0 });
}

function generate() {
  while (genY > camY - 120) {
    const h = startY - genY;
    const d = Math.min(1, h / 25000);
    // max gap stays below jump height (~179px)
    const gap = rand(22 + 55 * d, 60 + 85 * d);
    const y = genY - gap;
    const r = Math.random();
    let type = 'normal';
    if (h > 500 && r < 0.08 + 0.3 * d) type = 'moving';
    else if (h > 1500 && r < 0.14 + 0.4 * d) type = 'vanish';
    const pl = addPlatform(type, y);
    if (type !== 'vanish') pl.item = makeItem(pl, h);

    if (gap > 60) {
      const my = y + gap / 2;
      if (h > 2500 && h - lastMonsterH > 900 && Math.random() < 0.04 + 0.06 * d) {
        addMonster(my);
        lastMonsterH = h;
      } else if (h > 300 && Math.random() < 0.18 + 0.2 * d) {
        addPlatform('breaking', my - 7);
      }
    }
    genY = y;
  }
}

function resetGame() {
  platforms = []; monsters = []; bullets = []; particles = [];
  camY = 0; maxHeight = 0; score = 0; lastMonsterH = 0; fallT = 0;
  const base = { x: W / 2 - 29, y: H - 50, w: 58, h: 14, type: 'normal', vx: 0,
                 item: null, broken: false, bt: 0, vy: 0, gone: false, alpha: 1 };
  platforms.push(base);
  player = newPlayer(W / 2 - 20, base.y - 44);
  startY = player.y;
  genY = base.y;
  generate();
}

function resetMenu() {
  platforms = [{ x: 10, y: H - 80, w: 58, h: 14, type: 'normal', vx: 0, item: null,
                 broken: false, bt: 0, vy: 0, gone: false, alpha: 1 }];
  monsters = []; bullets = []; particles = [];
  camY = 0;
  player = newPlayer(19, H - 80 - 44);
}

/* ---------- UI ---------- */

function show(id) {
  for (const o of ['menu', 'pause', 'over']) $(o).classList.toggle('show', o === id);
  $('pauseBtn').style.display = (state === 'playing' || state === 'falling') ? 'block' : 'none';
}

function startGame() { stopPowerSound(); resetGame(); state = 'playing'; show(null); }
function goMenu() { stopPowerSound(); resetMenu(); state = 'menu'; $('menuBest').textContent = highscore; show('menu'); }
function pause() { if (state === 'playing') { state = 'paused'; stopPowerSound(); show('pause'); } }
function resume() {
  if (state !== 'paused') return;
  state = 'playing';
  if (player.power) startPowerSound(player.power);
  show(null);
}

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }

function gameOver() {
  state = 'over';
  stopPowerSound();
  const isNew = score > highscore;
  if (isNew) {
    highscore = score;
    try { localStorage.setItem(HS_KEY, String(highscore)); } catch (e) { /* storage unavailable */ }
  }
  $('ovScore').textContent = score;
  $('ovBest').textContent = highscore;
  $('newBest').style.display = isNew ? 'block' : 'none';
  show('over');
}

/* ---------- input ---------- */

addEventListener('keydown', e => {
  const k = e.code;
  if (state === 'menu' && (k === 'ArrowLeft' || k === 'ArrowRight')) setChar(charIdx + (k === 'ArrowLeft' ? -1 : 1));
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if ((k === 'Space' || k === 'ArrowUp' || k === 'KeyW') && !e.repeat) shoot();
  if (k === 'KeyP' || k === 'Escape') state === 'paused' ? resume() : pause();
  if (k === 'Enter' && (state === 'menu' || state === 'over')) { audio(); startGame(); }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
addEventListener('blur', () => { keys.left = keys.right = false; pause(); });

function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}

cv.addEventListener('mousedown', e => {
  const pt = toGame(e);
  shoot(pt.x, pt.y + camY);
});

// Tilt control (primary on mobile)
let tilt = 0, tiltActive = false;
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tiltActive = true;
  tilt = clamp(e.gamma / 25, -1, 1);
  if (Math.abs(tilt) < 0.08) tilt = 0;
});
function requestTilt() {
  // iOS requires a user gesture to grant sensor access
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(r => { if (r !== 'granted') $('tiltHint').textContent = 'tilt denied - using touch control'; })
      .catch(() => {});
  }
}
if ('ontouchstart' in window && !window.isSecureContext) {
  $('tiltHint').textContent = 'tilt needs https - using touch control';
}

// Touch: hold left/right half to move (only without tilt), short tap to shoot
const touches = new Map();
let touchDir = 0;
function updateTouchDir() {
  touchDir = 0;
  for (const t of touches.values()) touchDir = t.x < W / 2 ? -1 : 1;
}
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches.set(t.identifier, { ...toGame(t), time: performance.now() });
  updateTouchDir();
}, { passive: false });
function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier);
    touches.delete(t.identifier);
    if (s && e.type === 'touchend' && performance.now() - s.time < 200) shoot(s.x, s.y + camY);
  }
  updateTouchDir();
}
cv.addEventListener('touchend', touchEnd, { passive: false });
cv.addEventListener('touchcancel', touchEnd, { passive: false });

// audio() inside the click handler so browsers allow the AudioContext to start
$('playBtn').onclick = () => { requestTilt(); audio(); startGame(); };
$('againBtn').onclick = () => { requestTilt(); audio(); startGame(); };
$('prevChar').onclick = () => setChar(charIdx - 1);
$('nextChar').onclick = () => setChar(charIdx + 1);
$('soundBtn').onclick = e => {
  soundOn = !soundOn;
  store(SOUND_KEY, soundOn ? 'on' : 'off');
  updateSoundBtn();
  if (!soundOn) stopPowerSound();
  else if (state === 'playing' && player.power) startPowerSound(player.power);
  e.currentTarget.blur();
};
$('resumeBtn').onclick = resume;
$('pauseMenuBtn').onclick = goMenu;
$('overMenuBtn').onclick = goMenu;
$('pauseBtn').onclick = () => state === 'paused' ? resume() : pause();

function shoot(tx, ty) {
  const p = player;
  if (state !== 'playing' || p.dead || p.power || p.cool > 0) return;
  const sx = p.x + p.w / 2, sy = p.y - 10;
  let dx = 0, dy = -1;
  if (tx !== undefined) {
    dx = tx - sx; dy = Math.min(ty - sy, -20);
    const l = Math.hypot(dx, dy); dx /= l; dy /= l;
  }
  bullets.push({ x: sx, y: sy, vx: dx * 13, vy: dy * 13 });
  p.shootT = 15; p.cool = 8;
  SFX.shoot();
}

/* ---------- sound (synthesized, no audio files) ---------- */

let soundOn = load(SOUND_KEY) !== 'off';
let actx = null, powerSrc = null, powerLfo = null;

function audio() {
  if (!soundOn) return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function noiseBuffer(a, dur, fade) {
  const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (fade ? 1 - i / d.length : 1);
  return buf;
}

function noise(dur, vol, freq) {
  const a = audio();
  if (!a) return;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuffer(a, dur, true);
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination);
  s.start();
}

function startPowerSound(type) {
  stopPowerSound();
  const a = audio();
  if (!a) return;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuffer(a, 1, false); s.loop = true;
  f.type = type === 'jetpack' ? 'lowpass' : 'bandpass';
  f.frequency.value = type === 'jetpack' ? 700 : 1800;
  g.gain.value = type === 'jetpack' ? 0.25 : 0.12;
  s.connect(f).connect(g).connect(a.destination);
  if (type === 'propeller') {
    const lg = a.createGain();
    powerLfo = a.createOscillator();
    powerLfo.frequency.value = 18; lg.gain.value = 0.1;
    powerLfo.connect(lg).connect(g.gain);
    powerLfo.start();
  }
  s.start();
  powerSrc = s;
}

function stopPowerSound() {
  if (powerSrc) { powerSrc.stop(); powerSrc = null; }
  if (powerLfo) { powerLfo.stop(); powerLfo = null; }
}

const SFX = {
  jump:   () => tone('triangle', 280, 820, 0.12, 0.25),
  spring: () => { tone('triangle', 200, 1200, 0.3, 0.25); tone('sine', 300, 1500, 0.3, 0.12, 0.04); },
  tramp:  () => { tone('sine', 150, 900, 0.45, 0.3); tone('triangle', 300, 1400, 0.4, 0.12, 0.08); },
  crack:  () => { noise(0.2, 0.4, 900); tone('sawtooth', 200, 60, 0.15, 0.08); },
  shoot:  () => tone('square', 1100, 380, 0.08, 0.07),
  kill:   () => tone('square', 700, 90, 0.3, 0.1),
  hit:    () => tone('sawtooth', 500, 60, 0.5, 0.12),
  fall:   () => tone('sine', 1000, 110, 1.1, 0.18),
  pickup: () => { tone('triangle', 520, 520, 0.08, 0.15); tone('triangle', 780, 780, 0.08, 0.15, 0.08); tone('triangle', 1040, 1040, 0.12, 0.15, 0.16); },
};

function updateSoundBtn() { $('soundBtn').textContent = soundOn ? '\u{1F50A}' : '\u{1F507}'; }

/* ---------- update ---------- */

function killMonster(m, vy) {
  m.dead = true; m.vy = vy; m.vr = rand(-0.15, 0.15);
  SFX.kill();
}

function dropPower(p) {
  particles.push({ kind: p.power, x: p.x + (p.dir > 0 ? -10 : 20), y: p.y,
                   vx: -p.dir * 2, vy: -2, rot: 0, vr: -p.dir * 0.1 });
  p.power = null;
  stopPowerSound();
}

function menuStep() {
  const p = player, pl = platforms[0];
  p.vy += G; p.y += p.vy;
  if (p.vy > 0 && p.y + p.h >= pl.y) { p.y = pl.y - p.h; p.vy = -JUMP; }
}

function step() {
  if (state === 'menu') { frame++; menuStep(); return; }
  if (state !== 'playing' && state !== 'falling') return;
  frame++;
  const p = player;

  // horizontal movement with wrap-around
  if (!p.dead) {
    let ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (!ax && !tiltActive) ax = touchDir;
    if (ax) { p.vx += ax * 0.7; if (p.shootT <= 0) p.dir = ax; }
    else if (tiltActive && tilt) { p.vx += (tilt * MAXVX - p.vx) * 0.3; if (p.shootT <= 0) p.dir = Math.sign(tilt); }
    else p.vx *= 0.85;
    p.vx = clamp(p.vx, -MAXVX, MAXVX);
    p.x += p.vx;
    if (p.x + p.w / 2 < 0) p.x += W;
    else if (p.x + p.w / 2 > W) p.x -= W;
  }

  // vertical movement
  const prevBottom = p.y + p.h;
  if (p.power) {
    p.powerT--;
    p.vy += ((p.power === 'jetpack' ? -15 : -10) - p.vy) * 0.15;
    if (p.powerT <= 0) dropPower(p);
  } else {
    p.vy = Math.min(p.vy + G, 18);
  }
  p.y += p.vy;
  if (p.flip > 0) p.flip--;
  if (p.shootT > 0) p.shootT--;
  if (p.cool > 0) p.cool--;

  // platforms
  for (const pl of platforms) {
    if (pl.type === 'moving' && !pl.broken) {
      pl.x += pl.vx;
      if (pl.x < 0 || pl.x + pl.w > W) { pl.vx *= -1; pl.x = clamp(pl.x, 0, W - pl.w); }
    }
    if (pl.broken) { pl.bt++; pl.vy += 0.5; pl.y += pl.vy; }
    if (pl.gone) pl.alpha = Math.max(0, pl.alpha - 0.08);
  }

  // landing (springs/trampolines first, then platforms)
  const bottom = p.y + p.h, fl = p.x + 8, fr = p.x + p.w - 8;
  if (state === 'playing' && !p.dead && !p.power && p.vy > 0) {
    let landed = false;
    for (const pl of platforms) {
      const it = pl.item;
      if (pl.broken || pl.gone || !it || (it.type !== 'spring' && it.type !== 'trampoline')) continue;
      const ix = pl.x + it.ox, top = pl.y - it.h;
      if (prevBottom <= top + 1 && bottom >= top && fr > ix && fl < ix + it.w) {
        p.y = top - p.h;
        it.used = true;
        if (it.type === 'spring') { p.vy = -SPRING; SFX.spring(); }
        else { p.vy = -TRAMP; p.flip = 45; SFX.tramp(); }
        landed = true;
        break;
      }
    }
    if (!landed) {
      for (const pl of platforms) {
        if (pl.broken || pl.gone) continue;
        if (prevBottom <= pl.y + 1 && bottom >= pl.y && fr > pl.x && fl < pl.x + pl.w) {
          if (pl.type === 'breaking') { pl.broken = true; SFX.crack(); continue; }
          p.y = pl.y - p.h;
          p.vy = -JUMP;
          SFX.jump();
          if (pl.type === 'vanish') pl.gone = true;
          break;
        }
      }
    }
  }

  // power-up pickup
  if (!p.dead && !p.power) {
    for (const pl of platforms) {
      const it = pl.item;
      if (!it || (it.type !== 'propeller' && it.type !== 'jetpack')) continue;
      if (overlap(p.x + 4, p.y, p.w - 8, p.h, pl.x + it.ox, pl.y - it.h, it.w, it.h)) {
        pl.item = null;
        p.power = it.type;
        p.powerT = it.type === 'jetpack' ? 200 : 150;
        p.flip = 0;
        SFX.pickup();
        startPowerSound(it.type);
        break;
      }
    }
  }

  // monsters
  for (const m of monsters) {
    m.t++;
    if (m.dead) { m.vy += 0.5; m.y += m.vy; m.rot += m.vr; continue; }
    if (m.vx) { m.x += m.vx; if (m.x < 0 || m.x + m.w > W) { m.vx *= -1; m.x = clamp(m.x, 0, W - m.w); } }
    const my = m.y + Math.sin(m.t * 0.08) * 4;
    const hx = m.x + 6, hy = my + 4, hw = m.w - 12, hh = m.h - 8;
    if (!p.dead && overlap(p.x + 6, p.y + 4, p.w - 12, p.h - 4, hx, hy, hw, hh)) {
      if (p.power) killMonster(m, -4);
      else if (p.vy > 0 && prevBottom <= hy + hh * 0.5) { killMonster(m, 2); p.vy = -JUMP; }
      else { p.dead = true; p.vx = 0; p.vy = Math.max(p.vy, 0); SFX.hit(); }
    }
  }

  // bullets
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy;
    for (const m of monsters) {
      if (!m.dead && overlap(b.x - 3, b.y - 3, 6, 6, m.x, m.y, m.w, m.h)) {
        killMonster(m, -3); b.hit = true; break;
      }
    }
  }
  bullets = bullets.filter(b => !b.hit && b.y > camY - 20 && b.x > -20 && b.x < W + 20);

  for (const pt of particles) { pt.vy += 0.4; pt.x += pt.vx; pt.y += pt.vy; pt.rot += pt.vr; }

  // camera, score, generation
  if (state === 'playing') {
    if (p.y < camY + H * 0.4) camY = p.y - H * 0.4;
    maxHeight = Math.max(maxHeight, startY - p.y);
    score = Math.floor(maxHeight);
    generate();
    const limit = camY + H + 60;
    platforms = platforms.filter(pl => pl.y < limit && !(pl.gone && pl.alpha <= 0));
    monsters = monsters.filter(m => m.y < limit);
    particles = particles.filter(pt => pt.y < limit + 100);
    if (p.y > camY + H) { state = 'falling'; fallT = 0; SFX.fall(); }
  } else {
    fallT++;
    camY += (p.y - H * 0.3 - camY) * 0.1;
    if (fallT > 70) gameOver();
  }
}

/* ---------- drawing ---------- */

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

function drawBackground() {
  ctx.fillStyle = '#f7f2e2';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#d3e1ec';
  ctx.lineWidth = 1;
  const first = Math.ceil(camY / 20) * 20 - camY;
  for (let y = first; y < H; y += 20) line(0, y + .5, W, y + .5);
  for (let x = 0; x < W; x += 20) line(x + .5, 0, x + .5, H);
}

const PCOL = {
  normal:   ['#86c540', '#4d8a1c'],
  moving:   ['#5ab4e6', '#2a78ad'],
  breaking: ['#b98446', '#7a5124'],
  vanish:   ['#ffffff', '#b8b8b8'],
};

function platShape(x, y, w, h, fill, dark) {
  rr(x, y, w, h, h / 2);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineCap = 'round';
  ctx.strokeStyle = dark; ctx.lineWidth = 2.5;
  line(x + 6, y + h - 4, x + w - 6, y + h - 4);
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
  line(x + 7, y + 4, x + w * 0.45, y + 4);
}

function drawPlatform(pl) {
  const [f, d] = PCOL[pl.type];
  if (pl.type === 'breaking') {
    if (!pl.broken) {
      platShape(pl.x, pl.y, pl.w, pl.h, f, d);
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(pl.x + pl.w / 2 - 3, pl.y + 1);
      ctx.lineTo(pl.x + pl.w / 2 + 2, pl.y + 6);
      ctx.lineTo(pl.x + pl.w / 2 - 2, pl.y + pl.h - 1);
      ctx.stroke();
    } else {
      const a = Math.min(0.7, pl.bt * 0.04);
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.translate(pl.x + pl.w / 2 + side * pl.w / 4, pl.y + pl.h / 2);
        ctx.rotate(side * a);
        platShape(-pl.w / 4, -pl.h / 2, pl.w / 2 - 1, pl.h, f, d);
        ctx.restore();
      }
    }
    return;
  }
  ctx.globalAlpha = pl.alpha;
  platShape(pl.x, pl.y, pl.w, pl.h, f, d);
  ctx.globalAlpha = 1;
  if (pl.item) drawItem(pl.item.type, pl.x + pl.item.ox, pl.y - pl.item.h, pl.item.used);
}

function drawProp(cx, by, spin) {
  ctx.lineWidth = 2; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.arc(cx, by, 13, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = '#e8473a'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#f4c430'; ctx.fillRect(cx - 4, by - 14, 8, 14);
  ctx.restore();
  ctx.stroke();
  line(cx, by - 13, cx, by - 18);
  ctx.beginPath();
  ctx.ellipse(cx, by - 18, Math.max(1.5, 13 * Math.abs(Math.cos(spin))), 2.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#3a8fe0'; ctx.fill(); ctx.stroke();
}

function drawJet(x, y, flame) {
  ctx.lineWidth = 2; ctx.strokeStyle = INK;
  for (const tx of [x, x + 13]) {
    if (flame) {
      const len = rand(10, 20);
      ctx.beginPath(); ctx.moveTo(tx + 1, y + 30); ctx.lineTo(tx + 10, y + 30); ctx.lineTo(tx + 5.5, y + 30 + len);
      ctx.closePath(); ctx.fillStyle = '#f58a1f'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx + 3, y + 30); ctx.lineTo(tx + 8, y + 30); ctx.lineTo(tx + 5.5, y + 30 + len * 0.6);
      ctx.closePath(); ctx.fillStyle = '#ffe14a'; ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(tx + 2, y + 26); ctx.lineTo(tx + 9, y + 26); ctx.lineTo(tx + 10, y + 31); ctx.lineTo(tx + 1, y + 31);
    ctx.closePath(); ctx.fillStyle = '#6d6d6d'; ctx.fill(); ctx.stroke();
    rr(tx, y + 4, 11, 24, 5); ctx.fillStyle = '#c3cbd1'; ctx.fill(); ctx.stroke();
    rr(tx + 1, y, 9, 7, 3); ctx.fillStyle = '#e8473a'; ctx.fill(); ctx.stroke();
  }
}

function drawItem(type, x, y, used) {
  ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (type === 'spring') {
    const base = y + 14, ext = used ? 22 : 11;
    ctx.beginPath(); ctx.moveTo(x + 8, base);
    for (let i = 1; i <= 4; i++) ctx.lineTo(i % 2 ? x + 2 : x + 14, base - (ext - 3) * i / 4);
    ctx.lineTo(x + 8, base - ext + 2);
    ctx.strokeStyle = '#777'; ctx.lineWidth = 2.5; ctx.stroke();
    rr(x - 1, base - ext - 2, 18, 5, 2);
    ctx.fillStyle = '#cfcfcf'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  } else if (type === 'trampoline') {
    line(x + 5, y + 10, x + 8, y + 4);
    line(x + 31, y + 10, x + 28, y + 4);
    rr(x, y, 36, 6, 3);
    ctx.fillStyle = '#3d8fd6'; ctx.fill(); ctx.stroke();
  } else if (type === 'propeller') {
    drawProp(x + 14, y + 20, frame * 0.3);
  } else if (type === 'jetpack') {
    drawJet(x, y, false);
  }
}

/* ---------- characters (local coords: origin = box center, facing right) ---------- */

function ell(x, y, rx, ry, fill, stroke = true) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) ctx.stroke();
}

function legs(xs) {
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK;
  for (const lx of xs) {
    ctx.beginPath(); ctx.moveTo(lx, 12); ctx.lineTo(lx, 21); ctx.lineTo(lx + 4, 21); ctx.stroke();
  }
}

function torsoPath() {
  ctx.beginPath(); ctx.moveTo(-11, 15); ctx.lineTo(-9, 3);
  ctx.quadraticCurveTo(0, -1, 9, 3); ctx.lineTo(11, 15); ctx.closePath();
}

function torso(shirt, skin) {
  ctx.strokeStyle = INK;
  for (const s of [-1, 1]) {
    ctx.lineWidth = 2.5; line(s * 9, 5, s * 14, 12);
    ctx.lineWidth = 1.5; ell(s * 14.5, 12.5, 2.2, 2.2, skin);
  }
  ctx.lineWidth = 2.5;
  torsoPath(); ctx.fillStyle = shirt; ctx.fill(); ctx.stroke();
}

function eyes(sh, iris, y = -9, gap = 5) {
  const lx = sh ? 0 : 1.2, ly = sh ? -1.6 : 0;
  ctx.lineWidth = 1.5; ctx.strokeStyle = INK;
  for (const x of [-gap, gap]) {
    ell(x, y, 3.4, 4, '#fff');
    ell(x + lx, y + ly + 0.5, 2.1, 2.3, iris, false);
    ell(x + lx, y + ly + 0.5, 1, 1.1, INK, false);
  }
}

function grin(y, w, sh, gap = false) {
  ctx.lineWidth = 1.8; ctx.strokeStyle = INK;
  if (sh) { ell(0, y + 2, 2.6, 3, '#7a1f25'); return; }
  ctx.beginPath(); ctx.moveTo(-w, y); ctx.quadraticCurveTo(0, y + w * 1.3, w, y); ctx.closePath();
  ctx.fillStyle = '#7a1f25'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#fff'; ctx.fillRect(-w, y - 1, w * 2, 3.2);
  if (gap) { ctx.fillStyle = '#7a1f25'; ctx.fillRect(-0.6, y - 1, 1.2, 3.2); }
  ctx.restore();
  ctx.stroke();
}

function cheeks(y = -2, x = 9) {
  ctx.fillStyle = 'rgba(240,110,110,.35)';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * x, y, 3, 2, 0, 0, Math.PI * 2); ctx.fill(); }
}

function toastPath() {
  ctx.beginPath(); ctx.moveTo(-15, 14); ctx.lineTo(-15, -8);
  ctx.bezierCurveTo(-22, -12, -19, -27, -6, -24); ctx.quadraticCurveTo(0, -28, 6, -24);
  ctx.bezierCurveTo(19, -27, 22, -12, 15, -8); ctx.lineTo(15, 14); ctx.closePath();
}

function drawToasty(sh) {
  legs([-7, 4]);
  ctx.strokeStyle = INK;
  for (const s of [-1, 1]) {
    ctx.lineWidth = 2.5; line(s * 15, 2, s * 20, 8);
    ctx.lineWidth = 1.5; ell(s * 20.5, 8.5, 2.3, 2.3, '#fff');
  }
  ctx.lineWidth = 2.5;
  toastPath(); ctx.fillStyle = '#C47A2C'; ctx.fill(); ctx.stroke();
  ctx.save(); ctx.scale(0.8, 0.82); toastPath(); ctx.fillStyle = '#F5D98A'; ctx.fill(); ctx.restore();
  ctx.fillStyle = 'rgba(196,122,44,.35)';
  for (const [x, y] of [[-8, 6], [7, 8], [-3, -18], [9, -4], [-10, -6]]) {
    ctx.beginPath(); ctx.ellipse(x, y, 1.3, 0.9, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save(); ctx.rotate(-0.12); ctx.lineWidth = 1.8;
  rr(-7, -29, 13, 6, 2); ctx.fillStyle = '#FFF3A0'; ctx.fill(); ctx.stroke();
  ctx.restore();
  eyes(sh, '#3B2A1A', -8, 5.5);
  cheeks(-1, 10);
  grin(1, 6, sh);
}

function drawHanni(sh) {
  const HAIR = '#D9BC8A', SKIN = '#F0C8B0';
  legs([-6, 4]);
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.moveTo(-17, 9); ctx.lineTo(-18, -10); ctx.bezierCurveTo(-18, -30, 18, -30, 18, -10);
  ctx.lineTo(17, 9); ctx.quadraticCurveTo(0, 13, -17, 9); ctx.closePath();
  ctx.fillStyle = HAIR; ctx.fill(); ctx.stroke();
  torso('#B4442E', SKIN);
  ctx.strokeStyle = '#D4A017'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-5, 3); ctx.quadraticCurveTo(0, 9, 5, 3); ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = 1; ell(0, 8.5, 1.6, 2, '#E8B923');
  ctx.lineWidth = 2.5; ell(0, -8, 14, 15, SKIN);
  ctx.lineWidth = 2;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(0, -23.5);
    ctx.bezierCurveTo(s * 12, -24, s * 17, -14, s * 16, 2);
    ctx.lineTo(s * 12, 2);
    ctx.bezierCurveTo(s * 13, -10, s * 9, -18, 0, -20);
    ctx.closePath(); ctx.fillStyle = HAIR; ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle = '#EED9AE'; ctx.lineWidth = 1.2;
  line(-6, -21, -13, -8); line(6, -21, 13, -8);
  ctx.strokeStyle = INK; ctx.lineWidth = 1;
  for (const s of [-1, 1]) ell(s * 13.5, 3, 1.5, 1.5, '#E8B923');
  eyes(sh, '#6F8FB0');
  cheeks();
  grin(-1, 6.5, sh);
}

function drawVinci(sh) {
  const HAIR = '#7A5E45', SKIN = '#E8B89A';
  legs([-6, 4]);
  torso('#7F8890', SKIN);
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.moveTo(-13, -12); ctx.bezierCurveTo(-13, -26, 13, -26, 13, -12);
  ctx.lineTo(12, 0); ctx.quadraticCurveTo(10, 8, 3, 9.5); ctx.lineTo(-3, 9.5);
  ctx.quadraticCurveTo(-10, 8, -12, 0); ctx.closePath();
  ctx.fillStyle = SKIN; ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(138,106,85,.6)';
  for (let i = 0; i < 18; i++) {
    const a = Math.PI * (0.12 + 0.76 * i / 17);
    ctx.fillRect(Math.cos(a) * 9 - 0.5, 1.5 + Math.sin(a) * 6.5, 1, 1);
  }
  for (let x = -4; x <= 4; x += 1.6) ctx.fillRect(x, -3.2, 1, 1);
  ctx.beginPath(); ctx.moveTo(-13.5, -8); ctx.bezierCurveTo(-16, -22, -8, -27, 0, -26);
  ctx.quadraticCurveTo(9, -33, 16, -27); ctx.quadraticCurveTo(13, -24, 13.5, -15);
  ctx.lineTo(10, -18); ctx.quadraticCurveTo(0, -21, -10, -16); ctx.lineTo(-11, -8); ctx.closePath();
  ctx.fillStyle = HAIR; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#5E4632'; ctx.lineWidth = 1.2;
  line(-4, -24, 2, -29); line(2, -24, 8, -29);
  ctx.strokeStyle = HAIR; ctx.lineWidth = 2;
  line(-8, -15, -3, -16); line(3, -16, 8, -15);
  eyes(sh, '#4A3A2E', -10);
  grin(-1, 7.5, sh);
}

function drawMummy(sh) {
  const HAIR = '#4B2830', SKIN = '#EBC1A6';
  legs([-6, 4]);
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.moveTo(-18, -8); ctx.bezierCurveTo(-19, -30, 19, -30, 18, -8);
  ctx.lineTo(19, 2); ctx.lineTo(15, 0); ctx.lineTo(16, 5); ctx.lineTo(11, 2);
  ctx.lineTo(-11, 2); ctx.lineTo(-16, 5); ctx.lineTo(-15, 0); ctx.lineTo(-19, 2); ctx.closePath();
  ctx.fillStyle = HAIR; ctx.fill(); ctx.stroke();
  torso('#2B2D3A', SKIN);
  ctx.save(); torsoPath(); ctx.clip();
  ctx.fillStyle = '#9FD3E0';
  for (const [x, y, r] of [[-6, 8, -0.6], [5, 11, 0.5], [6, 5, 1], [-3, 13, 0.2]]) {
    ctx.beginPath(); ctx.ellipse(x, y, 3, 1.4, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.lineWidth = 2.5; torsoPath(); ctx.stroke();
  ell(0, -8, 14, 15, SKIN);
  ctx.beginPath(); ctx.moveTo(-15, -2); ctx.bezierCurveTo(-18, -24, -2, -28, 8, -24);
  ctx.bezierCurveTo(17, -20, 17, -10, 15, -2); ctx.lineTo(12, -11);
  ctx.quadraticCurveTo(3, -13, -6, -18); ctx.quadraticCurveTo(-11, -12, -12, -2); ctx.closePath();
  ctx.fillStyle = HAIR; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#7A3B48'; ctx.lineWidth = 1.2;
  line(-10, -20, 4, -16); line(-4, -23, 10, -14);
  ctx.strokeStyle = INK; ctx.lineWidth = 0.8; ell(-13.5, 1, 1, 1, '#fff');
  if (sh) {
    eyes(true, '#5A4636', -8);
  } else {
    ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    for (const x of [-5, 5]) { ctx.beginPath(); ctx.arc(x, -7, 3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  }
  cheeks(-1);
  if (sh) { grin(-1, 5, true); return; }
  ctx.beginPath(); ctx.moveTo(-6, -1); ctx.quadraticCurveTo(0, 5, 6, -1); ctx.quadraticCurveTo(0, 2, -6, -1);
  ctx.fillStyle = '#C06A72'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawDaddy(sh) {
  const SKIN = '#E6A88E', BEARD = '#D8CDB8', CAP = '#BDB6A6';
  legs([-6, 4]);
  torso('#3E5470', SKIN);
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ell(0, -8, 15, 15, SKIN);
  ctx.fillStyle = BEARD;
  for (let i = 0; i < 14; i++) ctx.fillRect((i % 7) * 4 - 12 + (i > 6 ? 2 : 0), -2 + Math.floor(i / 7) * 2.5, 1, 1);
  ctx.beginPath(); ctx.moveTo(-7, -3); ctx.quadraticCurveTo(0, -6, 7, -3); ctx.lineTo(8, 1);
  ctx.quadraticCurveTo(6, 10, 0, 11); ctx.quadraticCurveTo(-6, 10, -8, 1); ctx.closePath();
  ctx.fillStyle = BEARD; ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();
  grin(-1, 5.5, sh, true);
  ctx.lineWidth = 2; ctx.strokeStyle = '#1A1A22'; ctx.fillStyle = 'rgba(58,53,48,.92)';
  rr(-13, -14, 11, 7, 2); ctx.fill(); ctx.stroke();
  rr(2, -14, 11, 7, 2); ctx.fill(); ctx.stroke();
  line(-2, -12, 2, -12);
  ctx.strokeStyle = '#3A5AB0'; line(13, -12, 15.5, -11);
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
  line(-11, -12.5, -8, -12.5); line(4, -12.5, 7, -12.5);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.fillStyle = CAP;
  ctx.beginPath(); ctx.moveTo(-15.5, -14); ctx.bezierCurveTo(-16, -31, 16, -31, 15.5, -14); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, -15); ctx.quadraticCurveTo(22, -18, 27, -13); ctx.quadraticCurveTo(19, -11, 9, -13); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#A8202E'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(10, -12.2); ctx.quadraticCurveTo(19, -10.5, 26, -12.6); ctx.stroke();
  ctx.fillStyle = '#B0283A'; rr(-3, -24, 9, 5, 1.5); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1; ell(0, -27.5, 1.5, 1, CAP);
}

const CHARS = [
  { id: 'toasty', name: 'Toasty', draw: drawToasty },
  { id: 'hanni',  name: 'Hanni',  draw: drawHanni },
  { id: 'vinci',  name: 'Vinci',  draw: drawVinci },
  { id: 'mummy',  name: 'Mummy',  draw: drawMummy },
  { id: 'daddy',  name: 'Daddy',  draw: drawDaddy },
];
let charIdx = Math.max(0, CHARS.findIndex(c => c.id === load(CHAR_KEY)));

function setChar(i) {
  charIdx = (i + CHARS.length) % CHARS.length;
  $('charName').textContent = CHARS[charIdx].name;
  store(CHAR_KEY, CHARS[charIdx].id);
}

function drawPlayer(p, cx) {
  const cy = p.y + p.h / 2;
  const shooting = p.shootT > 0 && !p.power && !p.dead;
  ctx.save();
  ctx.translate(cx, cy);
  if (p.flip > 0) ctx.rotate((1 - p.flip / 45) * Math.PI * 2 * p.dir);
  ctx.save();
  ctx.scale(shooting ? 1 : p.dir, 1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (p.power === 'jetpack') {
    ctx.save(); ctx.translate(-34, -16); ctx.scale(0.8, 0.8); drawJet(0, 0, true); ctx.restore();
  }
  CHARS[charIdx].draw(shooting);
  if (p.power === 'propeller') drawProp(0, -19, frame * 0.6);
  ctx.restore();

  if (p.dead) {
    for (let i = 0; i < 3; i++) {
      const a = frame * 0.12 + i * Math.PI * 2 / 3;
      drawStar(Math.cos(a) * 16, -30 + Math.sin(a) * 4);
    }
  }
  ctx.restore();
}

function drawStar(x, y) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 2.2 : 5.5, a = i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffd93a'; ctx.fill();
  ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.stroke();
}

function drawMonster(m) {
  const y = m.dead ? m.y : m.y + Math.sin(m.t * 0.08) * 4;
  ctx.save();
  ctx.translate(m.x + m.w / 2, y + m.h / 2);
  ctx.rotate(m.rot);
  ctx.lineWidth = 2; ctx.strokeStyle = INK;

  const flap = Math.sin(m.t * 0.4) * 6;
  ctx.fillStyle = '#c9b8f5';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(s * 26, -6 + flap * 0.5, 10, 6 + Math.abs(flap) * 0.3, s * -0.5, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#6c4fc4';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 8, -15); ctx.lineTo(s * 13, -25); ctx.lineTo(s * 16, -13); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5640a3';
  for (const [sx, sy, r] of [[-15, 6, 3], [16, 3, 2.5], [-3, -12, 2]]) {
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
  }
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.arc(s * 9, -5, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 9 + (m.dead ? 0 : 1.5), -4, m.dead ? 1.2 : 2.6, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
  }
  ctx.beginPath(); ctx.moveTo(-11, 5); ctx.quadraticCurveTo(0, 17, 11, 5); ctx.closePath();
  ctx.fillStyle = '#9b1e2a'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  for (const tx of [-7, 0, 7]) {
    ctx.beginPath(); ctx.moveTo(tx - 2.5, 5.5); ctx.lineTo(tx + 2.5, 5.5); ctx.lineTo(tx, 9.5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawHighscoreLine() {
  if (highscore <= 0) return;
  const y = startY - highscore;
  if (y < camY - 10 || y > camY + H) return;
  ctx.save();
  ctx.setLineDash([8, 6]);
  ctx.strokeStyle = 'rgba(216,57,43,.55)'; ctx.lineWidth = 2;
  line(0, y, W, y);
  ctx.fillStyle = 'rgba(216,57,43,.8)';
  ctx.font = `18px ${FONT}`;
  ctx.fillText('best', W - 40, y - 4);
  ctx.restore();
}

function drawHud() {
  ctx.fillStyle = 'rgba(190,215,235,.7)';
  ctx.fillRect(0, 0, W, 44);
  ctx.strokeStyle = 'rgba(60,90,120,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 44);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, 44 + (x / 10 % 2 ? 1.5 : -1.5));
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.font = `32px ${FONT}`;
  ctx.fillText(score, 12, 34);
  ctx.font = `20px ${FONT}`;
  ctx.textAlign = 'right';
  ctx.fillText('best: ' + Math.max(highscore, 0), W - 96, 30);
  ctx.textAlign = 'left';
}

function render() {
  drawBackground();
  ctx.save();
  ctx.translate(0, -camY);
  if (state !== 'menu') drawHighscoreLine();
  for (const pl of platforms) drawPlatform(pl);
  for (const m of monsters) drawMonster(m);
  ctx.fillStyle = INK;
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
  for (const pt of particles) {
    ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
    drawItem(pt.kind, -12, -16, false);
    ctx.restore();
  }
  const p = player, cx = p.x + p.w / 2;
  drawPlayer(p, cx);
  if (p.x < 0) drawPlayer(p, cx + W);
  else if (p.x + p.w > W) drawPlayer(p, cx - W);
  ctx.restore();
  if (state !== 'menu') drawHud();
}

/* ---------- main loop ---------- */

let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last);
  last = t;
  while (acc >= STEP) { step(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
resize();
setChar(charIdx);
updateSoundBtn();
goMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
